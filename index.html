<!DOCTYPE html>
<html>
<head>
    <title>Shopee Review Scraper</title>
    <style>
        body { font-family: sans-serif; padding: 30px; }
        textarea { width: 100%; height: 250px; margin-top: 20px; font-family: monospace; }
    </style>
</head>
<body>
    <h2>🛍️ Shopee Review Scraper</h2>
    <form method="POST">
        <input type="text" name="product_url" placeholder="Paste link produk Shopee di sini..." style="width: 100%;" required>
        <br><br>
        <button type="submit">🔍 Mulai Scrape</button>
    </form>

    {% if log %}
    <h3>📋 Log Proses:</h3>
    <textarea readonly>{% for line in log %}{{ line }}\n{% endfor %}</textarea>
    <br>
    <a href="{{ download_link }}">⬇️ Download CSV</a>
    {% endif %}
</body>
</html>
