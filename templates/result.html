<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Scraping Berjalan</title>
    <meta http-equiv="refresh" content="3">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(to right, #fdfcfb, #e2d1c3);
            color: #333;
            padding: 40px;
            text-align: center;
        }

        h2 {
            color: #ff5722;
            margin-bottom: 20px;
        }

        pre {
            background-color: #f7f7f7;
            padding: 20px;
            text-align: left;
            border-radius: 8px;
            max-width: 800px;
            margin: 20px auto;
            font-size: 14px;
            overflow-x: auto;
            white-space: pre-wrap;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        a.download-link {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 25px;
            background-color: #4CAF50;
            color: white;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }

        a.download-link:hover {
            background-color: #388e3c;
        }

        form button {
            margin-top: 25px;
            background-color: #f44336;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        form button:hover {
            background-color: #c62828;
        }
    </style>
</head>
<body>
    <h2>🔄 Scraping Shopee sedang berjalan...</h2>

    <pre>
{% for line in log %}
{{ line }}
{% endfor %}
    </pre>

    {% if log and '✅ Selesai!' in log[-1] %}
    <a class="download-link" href="/download">⬇️ Download Hasil CSV</a>
    {% endif %}

    <form action="/stop-scraping" method="POST">
        <button type="submit">⏹️ Stop Scraping</button>
    </form>
</body>
</html>
